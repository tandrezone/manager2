<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline &middot; manager2</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="shell stack" style="padding-top:4rem;text-align:center">
  <h1>You are offline</h1>
  <p class="muted">
    The trade portal needs a connection to show live prices, stock and order
    status. Rather than show you figures that may have changed, it waits.
  </p>
  <p class="small faint">
    Anything you had typed into a checkout is still saved on this device and will
    reappear when you reconnect.
  </p>
  <button class="btn btn--primary btn--block" onclick="location.reload()">
    Try again
  </button>
</main>
</body>
</html>
